name: Test

# The tools read the registry's records, so the tests run in a checkout of the
# registry with this repository's files laid over it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: protocol

      - uses: actions/checkout@v4
        with:
          repository: encorescience/encore-registry
          path: registry

      - name: Lay the protocol over the registry
        run: |
          cd protocol
          git ls-files -z | grep -zvE '^(\.github/|README\.md$)' | xargs -0 -I{} cp --parents {} ../registry/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install --no-cache-dir uv pyyaml jsonschema nbformat pymupdf pytest

      - name: Unit tests
        working-directory: registry
        env:
          PROTOCOL_ROOT: ${{ github.workspace }}/protocol
        run: python -m pytest -q $(cd ../protocol && git ls-files 'tests/*.py')
