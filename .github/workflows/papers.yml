name: Paper run
run-name: "Paper run: ${{ inputs.paper || inputs.dataset || inputs.dandiset }}${{ inputs.replicate && format('/{0}', inputs.replicate) || '' }} ${{ inputs.role }}${{ inputs.account && inputs.account != 'verified' && format(' ({0})', inputs.account) || '' }}"

# One reader run on a target (docs/protocol.md, "Reader"): writing the claims file from the
# paper (`claims`), checking it against the paper (`claims-check`), or answering an attempt's
# questions (`answer`); or, before them, judging whether each paper the archive names is the paper
# behind the data (`paper-match`, docs/pipeline.md step 1), which runs an agent only for the papers
# the cheap checks of tools/paper_match.py leave open. Started by hand from the Actions tab or with
#   gh workflow run papers.yml -f dataset=000147 -f role=paper-match
#   gh workflow run papers.yml -f paper=guan-2022 -f role=claims
#
# These are the only runs that write the claims file, and the paper match papers/match/<folder>.yaml. The job runs in the `papers` environment,
# whose deploy key reads the private paper store (catalystneuro/registry-papers); the environment
# can be used only from main. Before the agent starts, tools/get_papers.sh copies the dataset's
# papers to paper/ and deletes the key and the store's checkout. A run commits only
# claims/<folder>/ and questions/<folder>.yaml, and its transcript leaves out everything under
# paper/ (tools/transcript.py). The attempt's other runs (attempt.yml) read the papers the same way.
#
# Otherwise the same as attempt.yml: a fresh runner, the subscription token, credentials
# stripped from the agent's commands, and a second job that commits to attempt/<folder>.

on:
  # Called by the registry's workflow of the same name, which is the one started by hand or by the
  # queue runner, and by its attempt-sequence.yml, before the author, at the version of this repository its protocol.lock names.
  workflow_call:
    inputs:
      dataset:
        type: string
        default: ""
      paper:
        type: string
        default: ""
      dandiset:
        type: string
        default: ""
      role:
        type: string
        required: true
      model:
        type: string
        default: claude-opus-5-5
      account:
        type: string
        default: verified
      # Outside CatalystNeuro (docs/outside-runs.md): the caller passes its own repository variables here, since a
      # called workflow cannot be relied on to read them. Empty: CatalystNeuro's paper store, and the accountable
      # name agent_run.py works out from the repository.
      papers_repo:
        type: string
        default: ""
      accountable:
        type: string
        default: ""
      # A run from encore-runner, or a fork of it (docs/outside-runs.md): the registry it reads, which it cannot
      # write to. The run starts from the attempt's branch there, and its results are signed and uploaded as a
      # submission (the `submit` job) for the registry's intake to take; nothing is pushed. Empty: the caller is the
      # registry itself, and the run commits to the attempt's branch (the `commit` job).
      registry:
        type: string
        default: ""
      replicate:
        type: string
        default: ""
      papers_only:
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED:
        required: false
      ANTHROPIC_API_KEY_CREDITS:
        required: false
      # The API key under its usual name, for a caller outside CatalystNeuro (docs/outside-runs.md).
      ANTHROPIC_API_KEY:
        required: false
      # The paper store's deploy key, for a caller in another organization (docs/outside-runs.md). GitHub's
      # `secrets: inherit` and a caller's environment secrets reach a reusable workflow only within one
      # organization, so a fork outside encorescience passes the key by name. The registry's own runs read it
      # from their `papers` environment, as before.
      PAPERS_DEPLOY_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: attempt-${{ inputs.paper || inputs.dataset || inputs.dandiset }}${{ inputs.replicate && format('-{0}', inputs.replicate) || '' }}
  cancel-in-progress: false

env:
  DATASET: ${{ inputs.dataset || inputs.dandiset }}
  PAPER: ${{ inputs.paper }}
  ROLE: ${{ inputs.role }}
  MODEL: ${{ inputs.model }}
  ACCOUNT: ${{ inputs.account || 'verified' }}
  REPLICATE: ${{ inputs.replicate }}
  REGISTRY: ${{ inputs.registry }}
  CLAUDE_CODE_VERSION: 2.1.284
  # The tools the agent may use without asking. With CLAUDE_CODE_SUBPROCESS_ENV_SCRUB set, Claude
  # Code forces permission mode `default`, so this list and --permission-prompts none decide what
  # runs: anything else is refused.
  TOOLS: Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Agent,TodoWrite
  # Tools that only make sense in a session someone comes back to. In a headless run, ending the
  # turn ends the run, so an agent that schedules a wakeup or watches a background job loses it.
  NOT_TOOLS: ScheduleWakeup,CronCreate,CronDelete,CronList,Monitor,RemoteTrigger,Workflow

jobs:
  run:
    runs-on: ubuntu-latest
    environment: papers
    timeout-minutes: 180
    outputs:
      started: ${{ steps.agent.outputs.started || steps.checks.outputs.started }}
      folder: ${{ steps.start.outputs.folder }}
      flagged: ${{ steps.flag.outputs.flagged }}
      account: ${{ steps.acct.outputs.account }}
      base_sha: ${{ steps.start.outputs.base_sha }}
      state: ${{ steps.start.outputs.state }}
      protocol_ref: ${{ steps.base.outputs.protocol_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.registry || github.repository }}
          persist-credentials: false
          fetch-depth: 1   # no step reads history, and all of it is ~930 MB (two jobs a run, eleven runs a chain)

      # The protocol comes from encore-protocol, at the version the registry's protocol.lock names; the
      # registry holds only the records. Its docs/, schemas/ and tools/ are laid over the checkout, where the
      # registry's .gitignore keeps them out of every commit.
      - uses: actions/checkout@v4
        with:
          repository: encorescience/encore-protocol
          path: .protocol
          fetch-depth: 0   # every version, for the one main names and the one the attempt's branch names
          persist-credentials: false

      - name: Lay the protocol over the registry, at main's version
        id: base
        run: |
          # Main's commit: the caller's own, or the registry's main for a run from encore-runner.
          main=$(git rev-parse HEAD)
          ref=$(git show "$main:protocol.lock" | tr -d '[:space:]')
          { echo "PROTOCOL_REF=$ref"; echo "MAIN_SHA=$main"; } >> "$GITHUB_ENV"
          echo "protocol_ref=$ref" >> "$GITHUB_OUTPUT"
          git -C .protocol archive "$ref" -- docs schemas tools | tar -x
          echo "Protocol $ref ($(git -C .protocol rev-parse --short "$ref^{commit}"))" >> "$GITHUB_STEP_SUMMARY"

      - name: Start from the attempt's branch if it exists
        id: start
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # The paper match is on a dataset, named by its folder (000147 for DANDI, <archive>-<id> otherwise); the
          # other roles are on a paper, named by its key (docs/paper-first.md). The name names the files and branch.
          if [ "$ROLE" = paper-match ]; then
            FOLDER=$(python3 tools/datasets.py folder "$DATASET") || { echo "::error::Not a dataset: $DATASET"; exit 1; }
            TDIR="match/$FOLDER"
          else
            FOLDER=$PAPER
            [[ "$FOLDER" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "::error::Not a paper key: '$PAPER'"; exit 1; }
            TDIR=$FOLDER
          fi
          BRANCH="attempt/$FOLDER"
          # A replicate's questions are answered on its own branch (docs/replicates.md); only the answer role runs there.
          if [ -n "$REPLICATE" ]; then
            [[ "$REPLICATE" =~ ^r[0-9]+$ ]] && [ "$ROLE" = answer ] || { echo "::error::A replicate takes a name r1, r2, ... and only the answer role"; exit 1; }
            BRANCH="replicate/$FOLDER/$REPLICATE"
          fi
          { echo "FOLDER=$FOLDER"; echo "BRANCH=$BRANCH"; echo "TDIR=$TDIR"; } >> "$GITHUB_ENV"
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"
          if [ -n "$REGISTRY" ]; then
            # From encore-runner, or a fork of it (docs/outside-runs.md). The registry is read and never written:
            # the attempt's state between runs is on this repository's own branch (tools/submission.py).
            [[ "$REGISTRY" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]] || { echo "::error::Not a repository: '$REGISTRY'"; exit 1; }
            [ -z "$REPLICATE" ] || { echo "::error::No replicates from encore-runner"; exit 1; }
            # The reader's runs on a paper. The paper match writes to the registry's main, and is made there.
            case "$ROLE" in claims|claims-check|answer) ;; *) echo "::error::From encore-runner, papers.yml runs claims, claims-check and answer"; exit 1;; esac
            # An attempt under way in the registry is named, on its branch there, with the repository making it
            # (Encore-Source). Two repositories do not attempt one paper at once.
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
              git fetch -q --depth 1 origin "$BRANCH"
              source=$(git log -1 --format='%(trailers:key=Encore-Source,valueonly)' FETCH_HEAD | tr -d '[:space:]')
              [ "$source" = "$GITHUB_REPOSITORY" ] || {
                echo "::error::The attempt on $FOLDER under way in $REGISTRY is not this repository's (${source:-begun in the registry}); wait for it to finish"; exit 1; }
            fi
            git -C .protocol show "$WORKFLOW_SHA:tools/submission.py" > "$RUNNER_TEMP/submission.py"
            runner="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            base=$MAIN_SHA
            # 0: the branch exists; 2: it does not; anything else: the question failed, and the run must not
            # start as if the attempt were new.
            there=0; git ls-remote --exit-code --heads "$runner" "$BRANCH" >/dev/null 2>&1 || there=$?
            [ $there = 0 ] || [ $there = 2 ] || { echo "::error::Could not read the branches of $GITHUB_REPOSITORY"; exit 1; }
            if [ $there = 0 ]; then
              # The state the runs before this one left, over the registry's commit the attempt began at. The
              # clone's own git folder, which holds the address with the token, goes before the agent starts.
              git clone -q --depth 1 --branch "$BRANCH" "$runner" "$RUNNER_TEMP/state" && rm -rf "$RUNNER_TEMP/state/.git"
              base=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["base_sha"])' "$RUNNER_TEMP/state/.encore/attempt.json")
              [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::The ledger of $BRANCH names no commit of $REGISTRY"; exit 1; }
              git fetch -q --depth 1 origin "$base" && git checkout -q -f --detach FETCH_HEAD
              python3 "$RUNNER_TEMP/submission.py" lay "$RUNNER_TEMP/state" --paper "$FOLDER"
              # Committed here, and nowhere else, so that what the run changes is told from what it started with.
              for d in claims attempts entries questions transcripts docs/pilot-notes summaries; do [ ! -e "$d" ] || git add -A -- "$d"; done
              git -c user.name=encore -c user.email=encore@users.noreply.github.com commit -q --allow-empty -m "The attempt's state"
              git restore --worktree --source "$MAIN_SHA" -- tools   # the registry's own tools, as main has them
              rm -rf "$RUNNER_TEMP/state"
            elif [ "$ROLE" != claims ]; then
              echo "::error::$GITHUB_REPOSITORY has no branch $BRANCH; run claims first"; exit 1
            fi
            echo "base_sha=$base" >> "$GITHUB_OUTPUT"
            echo "state=$(python3 "$RUNNER_TEMP/submission.py" digest --paper "$FOLDER")" >> "$GITHUB_OUTPUT"
            git log --oneline -1
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch --depth 1 origin "$BRANCH" && git checkout -f -B "$BRANCH" FETCH_HEAD
            # The registry's tools as the workflow has them, not as the branch had them when its attempt began: a
            # branch made before a fix would otherwise run without it. Working files only, so they are never committed.
            git restore --worktree --source "$MAIN_SHA" -- tools   # the registry's own tools, as main has them
          elif [ "$ROLE" != claims ] && [ "$ROLE" != paper-match ]; then
            echo "::error::No branch $BRANCH; run claims first"; exit 1
          fi
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git log --oneline -1

      # On the attempt's branch: the protocol's text (docs/, schemas/) at the version the attempt began with, which
      # its branch's protocol.lock names, so that one attempt follows one protocol; the tools at main's version, so
      # that a fix reaches a branch made before it. A branch from before the protocol had a repository of its own
      # (2026-11-23) has no protocol.lock and keeps the text it tracks.
      - name: Lay the protocol over the attempt's branch
        run: |
          branch_ref=$(tr -d '[:space:]' < protocol.lock 2>/dev/null || true)
          if [ -n "$branch_ref" ] && [ "$branch_ref" != "$PROTOCOL_REF" ]; then
            git -C .protocol ls-tree -r --name-only "$PROTOCOL_REF" -- docs schemas | xargs rm -f
            git -C .protocol archive "$branch_ref" -- docs schemas | tar -x
            echo "Protocol text from $branch_ref, as the attempt began" >> "$GITHUB_STEP_SUMMARY"
          fi
          git -C .protocol archive "$PROTOCOL_REF" -- tools | tar -x
          rm -rf .protocol

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code and the registry's tools
        run: |
          # The credential scrub runs the agent's commands in a sandbox built on bubblewrap and
          # socat. Bubblewrap needs unprivileged user namespaces; Ubuntu 24.04 restricts them.
          # The runner's DNS can fail for a few minutes (2026-11-11: six author runs stopped here in an hour, on
          # "Temporary failure resolving archive.ubuntu.com"). Each download is tried again, then the whole install.
          for try in 1 2 3 4; do
            sudo apt-get install -y -q -o Acquire::Retries=3 bubblewrap socat && break
            [ $try = 4 ] && { echo "::error::could not install bubblewrap and socat (the network?)"; exit 1; }
            sleep $((try * 30)); sudo apt-get update -q || true
          done
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-all true && echo "bubblewrap works"
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          pip install --no-cache-dir uv pyyaml jsonschema nbformat

      - name: Write the prompt
        env:
          ENCORE_ACCOUNTABLE: ${{ inputs.accountable }}
        run: |
          python tools/agent_run.py prompt "$ROLE" "$FOLDER" --model "$MODEL" > "$RUNNER_TEMP/prompt.md"
          # The workflow's own tools, copied before the agent can change the checkout.
          cp tools/transcript.py tools/progress.py tools/flagged.py "$RUNNER_TEMP/"

      - name: Put the papers under paper/
        env:
          PAPERS_DEPLOY_KEY: ${{ secrets.PAPERS_DEPLOY_KEY }}
          ENCORE_PAPERS_REPO: ${{ inputs.papers_repo }}
        run: |
          # The paper match reads the dataset's papers; the other roles, the paper's, from each of its datasets.
          if [ "$ROLE" = paper-match ]; then tools/get_papers.sh "$FOLDER" paper
          else tools/get_papers.sh "$(python tools/paper_records.py datasets "$FOLDER" | paste -sd, -)" paper \
                 "$(python tools/paper_records.py doi "$FOLDER")"; fi

      - name: Run the paper match's cheap checks
        id: checks
        if: ${{ inputs.role == 'paper-match' && !inputs.papers_only }}
        run: |
          # Writes papers/match/<folder>.yaml. When the checks settle every paper there is nothing for the agent.
          need=$(python tools/paper_match.py checks "$FOLDER" paper)
          cat "papers/match/$FOLDER.yaml"
          echo "need=$need" >> "$GITHUB_OUTPUT"
          if [ "$need" = done ]; then echo "started=true" >> "$GITHUB_OUTPUT"; fi

      - name: Choose the account
        id: acct
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_KEY: ${{ (secrets.ANTHROPIC_API_KEY_CREDITS || secrets.ANTHROPIC_API_KEY) != '' }}
        run: |
          # Outside CatalystNeuro there is usually one API key and no subscription token (docs/outside-runs.md): a
          # run asked for on the verified account, the default, then runs on the key. CatalystNeuro's runs, which
          # have the token, are unchanged.
          account=$ACCOUNT
          if [ "$account" = verified ] && [ "$HAS_TOKEN" != true ] && [ "$HAS_KEY" = true ]; then account=api; fi
          echo "account=$account" >> "$GITHUB_OUTPUT"; echo "ACCOUNT=$account" >> "$GITHUB_ENV"
          echo "Account: $account" >> "$GITHUB_STEP_SUMMARY"

      - name: Check that the unverified account has a token
        if: ${{ steps.acct.outputs.account == 'unverified' && steps.checks.outputs.need != 'done' }}
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED != '' }}
        run: |
          # The runner reads this message and repeats the run on the verified account.
          [ "$HAS_TOKEN" = true ] || { echo "::error::UNVERIFIED-UNAVAILABLE: no CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED secret"; exit 1; }

      - name: Check that the api account has its key
        if: ${{ steps.acct.outputs.account == 'api' && steps.checks.outputs.need != 'done' }}
        env:
          HAS_KEY: ${{ (secrets.ANTHROPIC_API_KEY_CREDITS || secrets.ANTHROPIC_API_KEY) != '' }}
        run: |
          [ "$HAS_KEY" = true ] || { echo "::error::API-UNAVAILABLE: no ANTHROPIC_API_KEY_CREDITS or ANTHROPIC_API_KEY secret"; exit 1; }

      - name: Check the token, the permission mode and the agent's shell
        if: ${{ !inputs.papers_only && steps.checks.outputs.need != 'done' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.acct.outputs.account != 'api' && (steps.acct.outputs.account == 'unverified' && secrets.CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED || secrets.CLAUDE_CODE_OAUTH_TOKEN) || '' }}
          ANTHROPIC_API_KEY: ${{ steps.acct.outputs.account == 'api' && (secrets.ANTHROPIC_API_KEY_CREDITS || secrets.ANTHROPIC_API_KEY) || '' }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
          DISABLE_AUTOUPDATER: '1'
          DISABLE_TELEMETRY: '1'
        run: |
          set +e -uo pipefail
          cd "$RUNNER_TEMP"
          # The agent runs one shell command that counts how many of the two credential variables its commands can
          # see, by name, without reading a value (0 when the scrub removed them), and prints a marker that shows
          # the sandboxed shell started. On 2026-11-06 the model often declined the earlier command, which read the
          # values, so the prompt says what the check is for, the command reads names only, and it is tried 3 times.
          for try in 1 2 3; do
            claude -p 'Before your task, this is the workflow'"'"'s own self-test that the credentials of this job are hidden from your shell. Use the Bash tool to run exactly this command, which prints only how many of two variable names are set in your shell, never a value: printf "%s:" "$(env | cut -d= -f1 | grep -c -x -e CLAUDE_CODE_OAUTH_TOKEN -e ANTHROPIC_API_KEY)"; echo shell-ok. Then reply with only the line it printed.' \
              --model "$MODEL" --max-turns 3 \
              --output-format stream-json --verbose --permission-prompts none --allowedTools "$TOOLS" \
              > preflight.jsonl 2> preflight.err
            mode=$(jq -r 'select(.type=="system" and .subtype=="init") | .permissionMode' preflight.jsonl)
            result=$(jq -r 'select(.type=="result") | .result' preflight.jsonl)
            echo "try $try: permission mode: $mode; reply: $result"
            case "$result" in
              *"Failed to authenticate"*|*"Invalid API key"*) echo "::error::The $ACCOUNT account's secret did not authenticate: $result"; exit 1;;
            esac
            [[ "$result" =~ [0-9]+:shell-ok ]] && break
          done
          tail -c 1000 preflight.err
          [[ "$result" =~ [0-9]+:shell-ok ]] || { echo "::error::The agent did not run the self-test in 3 tries; its reply: $result"; exit 1; }
          [[ "$result" =~ (^|[^0-9])0:shell-ok ]] || { echo "::error::The token is visible to the agent's commands"; exit 1; }
          [ "$mode" = default ] || { echo "::error::Claude Code started in permission mode $mode, not default"; exit 1; }

      - name: Run the agent
        if: ${{ !inputs.papers_only && steps.checks.outputs.need != 'done' }}
        id: agent
        # Shorter than the job's limit, so that the transcript is still exported when it is reached.
        timeout-minutes: 300
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.acct.outputs.account != 'api' && (steps.acct.outputs.account == 'unverified' && secrets.CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED || secrets.CLAUDE_CODE_OAUTH_TOKEN) || '' }}
          ANTHROPIC_API_KEY: ${{ steps.acct.outputs.account == 'api' && (secrets.ANTHROPIC_API_KEY_CREDITS || secrets.ANTHROPIC_API_KEY) || '' }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: '1'
          DISABLE_AUTOUPDATER: '1'
          DISABLE_TELEMETRY: '1'
          # Commands run in the foreground until they finish: a notebook run can take many minutes.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
          BASH_DEFAULT_TIMEOUT_MS: '3600000'
          BASH_MAX_TIMEOUT_MS: '7200000'
        run: |
          set +e -uo pipefail     # keep going when claude fails, to report how
          echo "started=true" >> "$GITHUB_OUTPUT"
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --model "$MODEL" \
            --output-format stream-json --verbose --forward-subagent-text \
            --permission-prompts none --allowedTools "$TOOLS" --disallowedTools "$NOT_TOOLS" \
            2> "$RUNNER_TEMP/stderr.txt" | tee "$RUNNER_TEMP/run.jsonl" | python "$RUNNER_TEMP/progress.py"
          status=$?
          echo "claude exited with $status"
          tail -c 2000 "$RUNNER_TEMP/stderr.txt" || true
          # What the run cost at API prices, which the pacer adds up for an account with a budget (pools.yaml).
          cost=$(jq -r 'select(.type=="result") | .total_cost_usd // empty' "$RUNNER_TEMP/run.jsonl" 2>/dev/null | tail -n 1)
          echo "ENCORE_COST_USD=${cost:-unknown} account=$ACCOUNT"
          exit $status

      - name: Check whether the account flagged the run
        id: flag
        if: always() && steps.agent.outputs.started == 'true' && env.ACCOUNT != 'verified'
        run: |
          # On an account other than the verified one, a run its safety checks flagged (a refusal, or a switch
          # to another model) is not kept: the job fails with FLAGGED, and the runner repeats it on the verified
          # account, or leaves the dataset when it has no fallback.
          if reason=$(python "$RUNNER_TEMP/flagged.py" "$RUNNER_TEMP/run.jsonl" "$RUNNER_TEMP/stderr.txt" --model "$MODEL"); then
            echo "not flagged"
          else
            echo "flagged=true" >> "$GITHUB_OUTPUT"
            echo "::error::FLAGGED on the $ACCOUNT account: $reason"
            echo "Flagged on the $ACCOUNT account: $reason. Not committed; repeat on the verified account." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Export the transcript and collect the changes
        if: always() && (steps.agent.outputs.started == 'true' || steps.checks.outputs.started == 'true') && steps.flag.outputs.flagged != 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"; mkdir -p "$out/transcripts/$TDIR"
          tool="$RUNNER_TEMP/transcript.py"
          name="$FOLDER · $ROLE · run ${{ github.run_id }}"
          # The reader's changes first, so that nothing in the transcript can lose them. Only the
          # paper's claims: never paper/.
          if [ "$ROLE" = paper-match ]; then paths=("papers/match/$FOLDER.yaml")
          else paths=("claims/$FOLDER.yaml"); [ ! -e "questions/$FOLDER.yaml" ] || paths+=("questions/$FOLDER.yaml"); fi
          git add -A -- "${paths[@]}" && git diff --cached --binary > "$out/changes.patch"
          git diff --cached --stat
          # No transcript when the paper match's checks settled every paper and no agent ran.
          [ -e "$RUNNER_TEMP/run.jsonl" ] || exit 0
          python "$tool" "$RUNNER_TEMP/run.jsonl" "$out/transcripts/$TDIR/$ROLE.md" --omit paper/ \
            --report "$out/transcripts/$TDIR/$ROLE-report.md" --title "$name"
          rm -f "$RUNNER_TEMP/run.jsonl"
          cat "$out/transcripts/$TDIR/$ROLE-report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Named for the dataset and role: in a pipeline, several datasets run inside one
          # workflow run, and an artifact name shared between them made a commit job pick up
          # another dataset's results.
          name: agent-run-${{ env.FOLDER }}-${{ inputs.role }}
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: ignore

  commit:
    needs: run
    # Whenever the agent was started, also when the run was cancelled or failed, so that its
    # transcript and partial work are kept; the commit message says how the run ended.
    if: always() && inputs.registry == '' && needs.run.outputs.started == 'true' && needs.run.outputs.flagged != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FOLDER: ${{ needs.run.outputs.folder }}
      ACCOUNT: ${{ needs.run.outputs.account || inputs.account || 'verified' }}
      BRANCH: ${{ inputs.replicate && format('replicate/{0}/{1}', needs.run.outputs.folder, inputs.replicate) || format('attempt/{0}', needs.run.outputs.folder) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1   # no step reads history, and all of it is ~930 MB (two jobs a run, eleven runs a chain)

      - uses: actions/checkout@v4
        with:
          repository: encorescience/encore-protocol
          path: .protocol
          fetch-depth: 0
          persist-credentials: false

      - name: Lay the protocol's tools over the registry, at main's version
        run: |
          git -C .protocol archive "$(git show "$GITHUB_SHA:protocol.lock" | tr -d '[:space:]')" -- tools | tar -x
          rm -rf .protocol

      - uses: actions/download-artifact@v4
        with:
          # Named for the dataset and role: in a pipeline, several datasets run inside one
          # workflow run, and an artifact name shared between them made a commit job pick up
          # another dataset's results.
          name: agent-run-${{ needs.run.outputs.folder }}-${{ inputs.role }}
          path: out

      - name: Commit to the attempt's branch
        run: |
          set -euo pipefail
          # Take the archiving script from the workflow's own ref: a branch made before it existed lacks it.
          cp tools/archive_transcripts.sh "$RUNNER_TEMP/"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch --depth 1 origin "$BRANCH" && git checkout -f -B "$BRANCH" FETCH_HEAD
          else
            git checkout -b "$BRANCH"
          fi
          # Refuse anything that is not this run's: a guard against results being mixed up.
          # `|| true`: grep finds nothing in a run that is all this one's, and fails, which `set -e` would stop on.
          if [ "$ROLE" = paper-match ]; then
            others=$({ ls out/transcripts | grep -vx match; ls out/transcripts/match 2>/dev/null | grep -vx "$FOLDER"; } || true)
          else others=$(ls out/transcripts | grep -vx "$FOLDER" || true); fi
          others=$(echo "$others" | grep . || true)
          [ -z "$others" ] || { echo "::error::Transcripts for other datasets or papers: $others"; exit 1; }
          # The claims run starts an attempt: it moves an earlier attempt's transcripts aside first.
          if [ "$ROLE" = claims ]; then "$RUNNER_TEMP/archive_transcripts.sh" "$FOLDER"; fi
          if [ -s out/changes.patch ]; then
            allowed="^(claims/$FOLDER\.yaml$|questions/$FOLDER\.yaml$|papers/match/$FOLDER\.yaml$)"
            stray=$(git apply --numstat out/changes.patch | cut -f3 | grep -vE "$allowed" || true)
            [ -z "$stray" ] || { echo "::error::Changes outside dataset $FOLDER: $stray"; exit 1; }
            git apply --index out/changes.patch
          fi
          # A transcript with nothing but its title means the agent never started; keep it out.
          for f in out/transcripts/*/*.md out/transcripts/match/*/*.md; do [ -e "$f" ] || continue; [ "$(wc -l < "$f")" -gt 2 ] || rm "$f"; done
          cp -r out/transcripts . && git add transcripts
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -m "Agent run on $FOLDER: $ROLE (${{ needs.run.result }})" \
            -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -m "Account: $ACCOUNT"
          git push origin "$BRANCH"

  # A run from encore-runner, or a fork of it (docs/outside-runs.md), cannot write to the registry. Its results, as the
  # commit job would have committed them, are gathered into one file (tools/submission.py), which GitHub signs as made
  # by this workflow, in the caller's repository and run. The file carries the digest of the state the run started
  # from. The job then adds the results to the attempt's state, on the caller's own branch attempt/<paper>, with the
  # run in its ledger. At the end of the attempt the registry's intake checks each signature and lays the submissions
  # one over the other, so that what it takes was made by this workflow, run after run, and was not edited between.
  submit:
    needs: run
    if: always() && inputs.registry != '' && needs.run.outputs.started == 'true' && needs.run.outputs.flagged != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # to push the state to the caller's own branch
      id-token: write       # to sign the submission
      attestations: write   # to keep the signature with the caller's repository
    env:
      FOLDER: ${{ needs.run.outputs.folder }}
      ACCOUNT: ${{ needs.run.outputs.account || inputs.account || 'verified' }}
      BASE_SHA: ${{ needs.run.outputs.base_sha }}
      STARTED_FROM: ${{ needs.run.outputs.state }}
      BRANCH: attempt/${{ needs.run.outputs.folder }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.registry }}
          ref: ${{ needs.run.outputs.base_sha }}   # the registry's commit the attempt began at
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: encorescience/encore-protocol
          path: .protocol
          fetch-depth: 0
          persist-credentials: false

      - name: Lay the protocol's tools over the registry, and take submission.py from this workflow's own version
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          git -C .protocol archive "$(tr -d '[:space:]' < protocol.lock)" -- tools | tar -x
          git -C .protocol show "$WORKFLOW_SHA:tools/submission.py" > "$RUNNER_TEMP/submission.py"
          rm -rf .protocol

      - uses: actions/download-artifact@v4
        with:
          name: agent-run-${{ needs.run.outputs.folder }}-${{ inputs.role }}
          path: out

      - name: Gather the run's changes, as the commit job would commit them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sub="$RUNNER_TEMP/submission.py"
          runner="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          state="$RUNNER_TEMP/state"
          # The state the run started from: this repository's branch, over the registry's commit, as in the run job.
          there=0; git ls-remote --exit-code --heads "$runner" "$BRANCH" >/dev/null 2>&1 || there=$?
          [ $there = 0 ] || [ $there = 2 ] || { echo "::error::Could not read the branches of $GITHUB_REPOSITORY"; exit 1; }
          if [ $there = 0 ]; then
            git clone -q --depth 1 --branch "$BRANCH" "$runner" "$state"
            python "$sub" lay "$state" --paper "$FOLDER"
            for d in claims attempts entries questions transcripts docs/pilot-notes summaries; do [ ! -e "$d" ] || git add -A -- "$d"; done
            git -c user.name=encore -c user.email=encore@users.noreply.github.com commit -q --allow-empty -m "The attempt's state"
          else
            git init -q -b "$BRANCH" "$state"
          fi
          before=$(python "$sub" digest --paper "$FOLDER")
          [ "$before" = "$STARTED_FROM" ] || {
            echo "::error::$BRANCH changed while the run was going (it started from $STARTED_FROM and the branch is now $before); run the role again"; exit 1; }
          # Refuse anything that is not this paper's, as the commit job does.
          others=$(ls out/transcripts | grep -vx "$FOLDER" || true)
          [ -z "$others" ] || { echo "::error::Transcripts for other papers: $others"; exit 1; }
          # As the commit job: the claims run starts an attempt, and moves an earlier attempt's transcripts aside.
          if [ "$ROLE" = claims ]; then tools/archive_transcripts.sh "$FOLDER"; fi
          if [ -s out/changes.patch ]; then
            allowed="^(claims/$FOLDER\.yaml$|questions/$FOLDER\.yaml$)"
            stray=$(git apply --numstat out/changes.patch | cut -f3 | grep -vE "$allowed" || true)
            [ -z "$stray" ] || { echo "::error::Changes outside paper $FOLDER: $stray"; exit 1; }
            git apply --index out/changes.patch
          fi
          # A transcript with nothing but its title means the agent never started; keep it out.
          for f in out/transcripts/*/*.md; do [ -e "$f" ] || continue; [ "$(wc -l < "$f")" -gt 2 ] || rm "$f"; done
          cp -r out/transcripts . && git add -A -- transcripts
          python "$sub" pack --paper "$FOLDER" --out submission \
            --meta role="$ROLE" --meta result="${{ needs.run.result }}" --meta account="$ACCOUNT" \
            --meta registry="$REGISTRY" --meta base_sha="$BASE_SHA" --meta state_before="$before" \
            --meta protocol_ref="${{ needs.run.outputs.protocol_ref }}" --meta repository="$GITHUB_REPOSITORY" \
            --meta run_id="$GITHUB_RUN_ID" --meta run_attempt="$GITHUB_RUN_ATTEMPT" --meta run_url="$RUN_URL"
          python "$sub" show submission/submission.tar.gz
          { echo "STATE_BEFORE=$before"; echo "STATE_AFTER=$(python "$sub" digest --paper "$FOLDER")"; } >> "$GITHUB_ENV"

      - name: Sign the submission
        id: sign
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: submission/submission.tar.gz

      - name: Keep the signature with the submission
        run: cp "${{ steps.sign.outputs.bundle-path }}" submission/submission.sigstore.json

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          # Named for the paper and role: a whole attempt can be one workflow run (sequence.yml).
          name: submission-${{ needs.run.outputs.folder }}-${{ inputs.role }}
          path: submission
          retention-days: 90

      - name: Add the results to the attempt's state, on this repository's branch
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          sub="$RUNNER_TEMP/submission.py"; state="$RUNNER_TEMP/state"
          python "$sub" lay . --into "$state" --paper "$FOLDER"
          python "$sub" record "$state" --paper "$FOLDER" --registry "$REGISTRY" --base-sha "$BASE_SHA" --role "$ROLE" \
            --run-url "$RUN_URL" --result "${{ needs.run.result }}" --before "$STATE_BEFORE" --after "$STATE_AFTER" \
            --artifact "$ARTIFACT"
          cd "$state" && git add -A
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Agent run on $FOLDER: $ROLE (${{ needs.run.result }})" -m "Run: $RUN_URL" -m "Account: $ACCOUNT"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          {
            echo "### $FOLDER, $ROLE"
            echo "Signed: ${{ steps.sign.outputs.attestation-url }}"
            echo
            echo "The results are on this repository's branch \`$BRANCH\`, from which the next run starts."
          } >> "$GITHUB_STEP_SUMMARY"
